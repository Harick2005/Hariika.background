<body id="opened">
    <div id="overlay"></div>
    <video id="bg" autoplay muted loop>
        <source data-default-src="./assets/ba_pv1_2k.mp4" />

    <img id="bg-image" alt="" class="is-hidden" />

    <!-- To-do List & Quick Notes (Góc trên bên phải) -->
    <div id="todo-container" class="corner-widget top-right">
        <button id="todo-toggle-btn" class="control-btn" type="button" title="Ghi chú & To-do List">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                <path d="M9 14l2 2 4-4"></path>
            </svg>
            <span id="todo-header-badge" class="todo-badge is-hidden">0</span>
        </button>

        <div id="todo-panel" class="menu-dropdown todo-dropdown is-hidden">
            <div class="panel-header">
                <div class="panel-tabs">
                    <button id="tab-btn-todo" class="panel-tab is-active" type="button">To-do List</button>
                    <button id="tab-btn-notes" class="panel-tab" type="button">Ghi chú</button>
                </div>
                <button id="todo-close-btn" class="panel-close-btn" type="button" aria-label="Đóng">&#215;</button>
            </div>

            <!-- Tab 1: To-do List -->
            <div id="todo-view-section" class="panel-section is-active">
                <form id="todo-form">
                    <input id="todo-input" type="text" placeholder="Thêm việc cần làm hôm nay..." autocomplete="off" />
                    <button id="todo-submit-btn" type="submit" title="Thêm việc">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </form>
                <div class="todo-list-wrap -custom-scrollbar">
                    <ul id="todo-items-list"></ul>
                </div>
                <div class="todo-panel-footer">
                    <span id="todo-remaining-count">0 việc cần làm</span>
                    <button id="todo-clear-done-btn" type="button">Xóa đã xong</button>
                </div>
            </div>

            <!-- Tab 2: Quick Notes -->
            <div id="notes-view-section" class="panel-section is-hidden">
                <textarea id="quick-notes-textarea" class="-custom-scrollbar" placeholder="Ghi chú nhanh ý tưởng, bài tập, link cần lưu... (Tự động lưu vào máy)"></textarea>
                <div class="notes-panel-footer">
                    <span id="notes-auto-save-label">&#10003; Đã lưu tự động</span>
                    <button id="notes-clear-btn" type="button">Xóa ghi chú</button>
                </div>
            </div>
        </div>
    </div>

    <main id="app">
        <h1 id="time">
            <span id="hour">9</span>:<span id="minute">41</span>
        </h1>

        <button id="status">
            <div class="status" title="temperature">

                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>

                Toggle Widgets
            </button>
            <button id="bg-control" class="menu-option">
                Background
            </button>
        </div>
    </div>

    <!-- Bộ đếm thời gian / Hẹn giờ (Góc phải phía dưới màn hình) -->
    <div id="timer-container" class="corner-widget bottom-right">
        <button id="timer-toggle-btn" class="control-btn" type="button" title="Bộ đếm thời gian / Hẹn giờ">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="timer-badge" class="timer-badge is-hidden">25:00</span>
        </button>

        <div id="timer-panel" class="menu-dropdown timer-dropdown is-hidden">
            <div class="panel-header">
                <span class="panel-title">Hẹn giờ / Tập trung</span>
                <button id="timer-close-btn" class="panel-close-btn" type="button" aria-label="Đóng">&#215;</button>
            </div>

            <!-- Compact display -->
            <div class="timer-display-box">
                <div id="timer-digits">25:00</div>
                <div id="timer-status-hint">Sẵn sàng</div>
            </div>

            <!-- Quick presets -->
            <div class="timer-presets">
                <button class="timer-preset-btn" data-mins="5" type="button">5m</button>
                <button class="timer-preset-btn" data-mins="15" type="button">15m</button>
                <button class="timer-preset-btn is-active" data-mins="25" type="button">25m</button>
                <button class="timer-preset-btn" data-mins="45" type="button">45m</button>
                <button class="timer-preset-btn" data-mins="60" type="button">60m</button>
            </div>

            <!-- Custom time setting: Set giờ theo ý muốn -->
            <div class="timer-custom-row">
                <span class="timer-custom-label">Tùy chỉnh:</span>
                <div class="timer-stepper">
                    <button id="timer-minus-btn" class="timer-step-btn" type="button" title="Giảm 1 phút">-</button>
                    <input id="timer-custom-input" type="number" min="1" max="999" value="25" />
                    <button id="timer-plus-btn" class="timer-step-btn" type="button" title="Tăng 1 phút">+</button>
                </div>
                <span class="timer-unit">phút</span>
                <button id="timer-set-btn" class="timer-apply-btn" type="button">Đặt</button>
            </div>

            <!-- Sound settings: Bỏ âm thanh vào / Chọn chuông báo khi hết giờ -->
            <div class="timer-sound-section">
                <div class="timer-sound-header">
                    <span class="timer-sound-label">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <span>Chuông khi hết giờ</span>
                    </span>
                    <button id="timer-test-sound-btn" class="timer-sound-test-btn" type="button" title="Nghe thử âm thanh">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span id="timer-test-btn-text">Thử</span>
                    </button>
                </div>

                <div class="timer-sound-select-row">
                    <select id="timer-sound-select" class="timer-sound-select">
                        <option value="chime">Chuông ngân (Mặc định)</option>
                        <option value="beep">Báo thức Beep-beep</option>
                        <option value="bell">Chuông reo (Bell)</option>
                        <option value="custom">File âm thanh tự chọn...</option>
                    </select>
                </div>

                <!-- Box bỏ file âm thanh vào / tải file âm thanh tùy chọn -->
                <div id="timer-custom-sound-box" class="timer-custom-sound-box">
                    <input id="timer-sound-file-input" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac" hidden />
                    <button id="timer-upload-btn" class="timer-upload-btn" type="button" title="Bấm để chọn file hoặc kéo thả file âm thanh vào đây">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>Bỏ âm thanh vào (Chọn file)</span>
                    </button>
                    <div id="timer-sound-file-info" class="timer-sound-file-info is-hidden">
                        <span id="timer-sound-filename" class="timer-sound-filename">custom-sound.mp3</span>
                        <button id="timer-remove-sound-btn" class="timer-remove-sound-btn" type="button" title="Xóa file âm thanh này, về mặc định">&#215;</button>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="timer-actions-row">
                <button id="timer-run-btn" class="timer-action-primary" type="button">Bắt đầu</button>
                <button id="timer-reset-btn" class="timer-action-secondary" type="button" title="Đặt lại">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div id="bg-modal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close="true"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="bg-modal-title">
            <div class="modal-header">
                <h2 id="bg-modal-title">Background</h2>
                <button id="bg-modal-close" class="modal-close" type="button" aria-label="Close">
                    &#215;
                </button>
            </div>
            <div class="modal-tabs" role="tablist">
                <button id="bg-tab-upload" class="modal-tab is-active" type="button" role="tab" aria-selected="true">
                    Upload
                </button>
                <button id="bg-tab-url" class="modal-tab" type="button" role="tab" aria-selected="false">
                    URL
                </button>
            </div>
            <div class="modal-body">
                <div id="bg-panel-upload" class="modal-panel is-active" role="tabpanel">
                    <input id="bg-input" type="file" accept="image/*,video/*" hidden multiple />
                    <button id="bg-select-file" class="modal-action" type="button">
                        Choose files
                    </button>

                    <p class="modal-hint">Supports images and videos from your device.</p>
                </div>
                <div id="bg-panel-url" class="modal-panel" role="tabpanel">
                    <label class="modal-label" for="bg-url-input">URL</label>
                    <input id="bg-url-input" class="modal-input" type="url" placeholder="https://..." />
                    <label class="modal-label" for="bg-url-type">Type</label>
                    <select id="bg-url-type" class="modal-select">
                        <option value="image">Image</option>
                        <option value="video">Video</option>
                    </select>
                    <button id="bg-apply-url" class="modal-action" type="button">
                        Apply URL
                    </button>
                </div>
                <div class="modal-preview">
                    <div id="bg-preview" class="preview-box">
                        <img id="bg-preview-image" alt="" class="is-hidden" />
                        <video id="bg-preview-video" class="is-hidden" muted loop playsinline></video>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="bg-reset" class="modal-secondary" type="button">Use default</button>
                <button id="bg-modal-done" class="modal-primary" type="button">Done</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
